<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Study Reviewer — Sistema Inteligente de Revisão Ativa e Repetição Espaçada">
    <title>{% block title %}Study Reviewer{% endblock %}</title>

    <!-- Prevenção estrita de FOUC para Dark Mode -->
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Tailwind CSS Compilado Estático -->
    <link rel="stylesheet" href="/static/css/tailwind.css">

    <!-- CSS Base Local e Mecânicas 3D -->
    <link rel="stylesheet" href="/static/css/app.css">

    <!-- HTMX para interações ágeis sem recarregar a tela -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 flex flex-col font-sans transition-colors duration-200">

    <!-- Link de Acessibilidade (WCAG AA - Pular para o conteúdo principal) -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-indigo-600 focus:text-white focus:rounded-md focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Pular para o conteúdo principal
    </a>

    <!-- Topbar de Navegação Responsiva -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/90 backdrop-blur sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <a href="/study" class="flex items-center space-x-2 text-xl font-bold tracking-tight text-indigo-600 dark:text-indigo-400">
                    <span aria-hidden="true">🧠</span>
                    <span>Study Reviewer</span>
                </a>
                <nav class="hidden md:flex space-x-4" aria-label="Navegação Principal">
                    <a href="/study" class="px-3 py-2 rounded-md text-sm font-medium {% if request.url.path.startswith('/study') %}text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/40{% else %}text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400{% endif %}">
                        Estudar
                    </a>
                    <a href="/flashcards/new" class="px-3 py-2 rounded-md text-sm font-medium {% if request.url.path.startswith('/flashcards') %}text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/40{% else %}text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400{% endif %}">
                        Novo Flashcard
                    </a>
                    <a href="/subjects" class="px-3 py-2 rounded-md text-sm font-medium {% if request.url.path.startswith('/subjects') %}text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/40{% else %}text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400{% endif %}">
                        Matérias & Temas
                    </a>
                </nav>
            </div>

            <!-- Botão de Alternância de Dark Mode -->
            <div class="flex items-center space-x-3">
                <button id="theme-toggle" type="button" aria-label="Alternar tema claro e escuro" class="p-2.5 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main id="main-content" class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col focus:outline-none" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Barra Inferior de Navegação Mobile (Ergonomia Mobile-First) -->
    <nav class="md:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 grid grid-cols-3 py-2 sticky bottom-0 z-30" aria-label="Navegação Inferior Mobile">
        <a href="/study" class="flex flex-col items-center justify-center py-1 text-xs font-medium {% if request.url.path.startswith('/study') %}text-indigo-600 dark:text-indigo-400{% else %}text-slate-500 dark:text-slate-400{% endif %}">
            <span class="text-lg" aria-hidden="true">📖</span>
            <span>Estudo</span>
        </a>
        <a href="/flashcards/new" class="flex flex-col items-center justify-center py-1 text-xs font-medium {% if request.url.path.startswith('/flashcards') %}text-indigo-600 dark:text-indigo-400{% else %}text-slate-500 dark:text-slate-400{% endif %}">
            <span class="text-lg" aria-hidden="true">➕</span>
            <span>Cadastrar</span>
        </a>
        <a href="/subjects" class="flex flex-col items-center justify-center py-1 text-xs font-medium {% if request.url.path.startswith('/subjects') %}text-indigo-600 dark:text-indigo-400{% else %}text-slate-500 dark:text-slate-400{% endif %}">
            <span class="text-lg" aria-hidden="true">📚</span>
            <span>Matérias</span>
        </a>
    </nav>

    <!-- Script de Gestão do Tema e Ícones -->
    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function updateIcons() {
            if (document.documentElement.classList.contains('dark')) {
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            } else {
                darkIcon.classList.remove('hidden');
                lightIcon.classList.add('hidden');
            }
        }

        updateIcons();

        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            updateIcons();
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
