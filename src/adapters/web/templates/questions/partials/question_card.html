<!-- Partial do Card de Pergunta Aberta SRS (Fase A: Recall / Fase B: Avaliação) -->
<div id="question-card" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm p-6 sm:p-8 flex flex-col justify-between min-h-[420px] sm:min-h-[480px] transition-opacity duration-200" data-question-id="{{ card.question_id }}">
    <!-- Cabeçalho do Card: Taxonomia, Nível SRS e Contador -->
    <div>
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-100 dark:border-slate-800 text-xs font-medium text-slate-500 dark:text-slate-400">
            <div class="flex items-center space-x-2">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                    {{ card.subject_name }} / {{ card.topic_name }}
                </span>
                <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 font-semibold" title="Nível de repetição espaçada e próximo intervalo">
                    Nível {{ card.current_level }} • {{ card.interval_days }}d
                </span>
            </div>
            <div class="text-xs font-semibold text-slate-400 dark:text-slate-500" aria-label="Progresso da sessão">
                Pergunta {{ current_num }} de {{ total_due }}
            </div>
        </div>

        <!-- Enunciado (Prompt) com suporte a Markdown seguro -->
        <div class="prose dark:prose-invert max-w-none text-slate-900 dark:text-slate-100 text-base sm:text-lg mb-6 leading-relaxed select-text" id="question-prompt">
            {{ card.prompt | safe }}
        </div>

        <!-- Botão de Revelação do Gabarito (Fase A) -->
        <div id="reveal-action-container" class="flex justify-center my-6">
            <button
                type="button"
                id="btn-reveal-answer"
                aria-expanded="false"
                aria-controls="expected-answer-section"
                onclick="revealAnswer()"
                class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-sm font-semibold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-sm transition-all transform active:scale-95 cursor-pointer"
            >
                <span class="mr-2" aria-hidden="true">💡</span>
                <span>Revelar Resposta Esperada</span>
            </button>
        </div>

        <!-- Gabarito Esperado (Fase B - Oculto inicialmente) -->
        <div
            id="expected-answer-section"
            class="hidden mb-6 p-4 sm:p-5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 transition-all duration-300"
            role="region"
            aria-label="Resposta Esperada"
        >
            <div class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">
                Resposta Esperada (Gabarito)
            </div>
            <div class="prose dark:prose-invert max-w-none text-slate-800 dark:text-slate-200 text-sm sm:text-base leading-relaxed">
                {{ card.expected_answer | safe }}
            </div>
        </div>
    </div>

    <!-- Painel Híbrido de Autoavaliação (Desabilitado até a revelação) -->
    <form
        id="srs-evaluation-form"
        hx-post="/questions/{{ card.question_id }}/review"
        hx-target="#srs-study-container"
        hx-swap="innerHTML"
        hx-indicator="#srs-spinner"
        class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-800 opacity-40 pointer-events-none transition-opacity duration-300"
        aria-label="Painel de autoavaliação"
    >
        <div class="space-y-4">
            <!-- 5 Presets Neutros em Paleta Slate/Gray -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-2">
                    Autoavaliação de Domínio (Atalhos 1 a 5):
                </label>
                <div class="grid grid-cols-5 gap-2" role="group" aria-label="Presets rápidos de autoavaliação">
                    <button type="button" class="btn-preset py-2 px-1 text-xs sm:text-sm font-semibold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" data-value="0" onclick="applyPreset(0)" aria-pressed="false">
                        0%
                    </button>
                    <button type="button" class="btn-preset py-2 px-1 text-xs sm:text-sm font-semibold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" data-value="25" onclick="applyPreset(25)" aria-pressed="false">
                        25%
                    </button>
                    <button type="button" class="btn-preset py-2 px-1 text-xs sm:text-sm font-semibold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" data-value="50" onclick="applyPreset(50)" aria-pressed="false">
                        50%
                    </button>
                    <button type="button" class="btn-preset py-2 px-1 text-xs sm:text-sm font-semibold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" data-value="75" onclick="applyPreset(75)" aria-pressed="false">
                        75%
                    </button>
                    <button type="button" class="btn-preset py-2 px-1 text-xs sm:text-sm font-semibold rounded-lg border border-indigo-600 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors" data-value="100" onclick="applyPreset(100)" aria-pressed="true">
                        100%
                    </button>
                </div>
            </div>

            <!-- Slider Contínuo (0 a 100) com Sincronização Bidirecional -->
            <div class="flex items-center space-x-4">
                <label for="score-slider" class="sr-only">Nota de autoavaliação contínua de 0 a 100 por cento</label>
                <input
                    type="range"
                    min="0"
                    max="100"
                    step="1"
                    id="score-slider"
                    name="score"
                    value="100"
                    oninput="syncSlider(this.value)"
                    class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                <output id="score-display" class="w-16 text-center text-sm font-bold text-slate-800 dark:text-slate-200 py-1 px-2 bg-slate-100 dark:bg-slate-800 rounded-md border border-slate-200 dark:border-slate-700" aria-live="polite">
                    100%
                </output>
            </div>

            <!-- Botão de Confirmação e Submissão -->
            <div class="flex items-center justify-end space-x-3 pt-2">
                <button
                    type="submit"
                    id="btn-confirm-review"
                    hx-disabled-elt="this, .btn-preset"
                    class="inline-flex items-center justify-center px-5 py-2.5 border border-transparent text-sm font-semibold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-sm transition-all transform active:scale-95 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <span>Confirmar e Próxima</span>
                    <span class="ml-1.5" aria-hidden="true">➔</span>
                </button>
            </div>
        </div>
    </form>
</div>

<!-- Out-of-band updates para o badge de revisão da navbar -->
<span id="review-badge" hx-swap-oob="outerHTML" class="ml-1.5 inline-flex items-center justify-center px-1.5 py-0.5 text-xs font-bold leading-none text-white bg-indigo-600 rounded-full {% if not total_due %}hidden{% endif %}">
    {{ total_due }}
</span>
<span id="review-badge-mobile" hx-swap-oob="outerHTML" class="absolute -top-1 -right-2 inline-flex items-center justify-center px-1 py-0.2 text-[10px] font-bold leading-none text-white bg-indigo-600 rounded-full min-w-[16px] h-4 {% if not total_due %}hidden{% endif %}">
    {{ total_due }}
</span>

<!-- Script local de controle do Card -->
<script>
    window.isAnswerRevealed = false;

    function revealAnswer() {
        const answerSection = document.getElementById('expected-answer-section');
        const revealBtn = document.getElementById('btn-reveal-answer');
        const form = document.getElementById('srs-evaluation-form');
        const announcer = document.getElementById('srs-announcer');

        if (answerSection && form && revealBtn) {
            answerSection.classList.remove('hidden');
            revealBtn.setAttribute('aria-expanded', 'true');
            document.getElementById('reveal-action-container').classList.add('hidden');

            // Habilita controles de avaliação
            form.classList.remove('opacity-40', 'pointer-events-none');
            window.isAnswerRevealed = true;

            // Anuncia no leitor de tela
            if (announcer) {
                announcer.textContent = "Resposta esperada revelada. Painel de avaliação habilitado.";
            }

            // Foco programático no slider sem perder o contexto
            const slider = document.getElementById('score-slider');
            if (slider) {
                slider.focus();
            }
        }
    }

    function applyPreset(val) {
        const slider = document.getElementById('score-slider');
        const display = document.getElementById('score-display');
        if (slider && display) {
            slider.value = val;
            display.textContent = val + '%';
            updatePresetButtons(val);
        }
    }

    function syncSlider(val) {
        const display = document.getElementById('score-display');
        if (display) {
            display.textContent = val + '%';
            updatePresetButtons(parseInt(val, 10));
        }
    }

    function updatePresetButtons(activeVal) {
        const buttons = document.querySelectorAll('.btn-preset');
        buttons.forEach(btn => {
            const btnVal = parseInt(btn.getAttribute('data-value'), 10);
            if (btnVal === activeVal) {
                btn.setAttribute('aria-pressed', 'true');
                btn.className = 'btn-preset py-2 px-1 text-xs sm:text-sm font-semibold rounded-lg border border-indigo-600 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors';
            } else {
                btn.setAttribute('aria-pressed', 'false');
                btn.className = 'btn-preset py-2 px-1 text-xs sm:text-sm font-semibold rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors';
            }
        });
    }

    // Teclas de atalho acessíveis WCAG 2.1.4
    document.addEventListener('keydown', function handleSrsShortcuts(e) {
        // Ignora se estiver digitando em campo de texto
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (activeTag === 'INPUT' && document.activeElement.type !== 'range') return;
        if (activeTag === 'TEXTAREA') return;

        // Se a resposta ainda não foi revelada
        if (!window.isAnswerRevealed) {
            if (e.code === 'Space' || e.code === 'Enter') {
                if (document.activeElement && document.activeElement.id === 'btn-reveal-answer') {
                    // comportamento nativo
                    return;
                }
                const btn = document.getElementById('btn-reveal-answer');
                if (btn && !btn.closest('#reveal-action-container').classList.contains('hidden')) {
                    e.preventDefault();
                    revealAnswer();
                }
            }
            return;
        }

        // Se a resposta já foi revelada, atalhos numéricos 1 a 5
        const presets = { '1': 0, '2': 25, '3': 50, '4': 75, '5': 100 };
        if (presets.hasOwnProperty(e.key)) {
            e.preventDefault();
            applyPreset(presets[e.key]);
        }
    });
</script>
