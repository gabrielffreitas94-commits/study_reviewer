[project]
name = "study-reviewer"
version = "0.1.0"
description = "Sistema Inteligente de Revisão Ativa e Repetição Espaçada"
readme = "PRD.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "cryptography>=50.0.2",
    "alembic>=1.20.0",
    "nh3>=0.3.7",
    "redis>=8.1.0",
    "fakeredis>=2.39.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.108",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "httpx>=0.27.2",
    "moto[dynamodb]>=5.2.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # Permite assert e tokens de teste nos testes

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
markers = [
    "security: Testes que avaliam aspectos de segurança e vulnerabilidade (requerem docstring estruturada obrigatória)",
    "unit: Testes unitários puros de domínio e serviços",
    "integration: Testes de integração de adaptadores, banco e controllers",
    "e2e: Testes ponta a ponta",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "src/main.py",
    "*/main.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
