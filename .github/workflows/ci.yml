name: CI/CD Pipeline — Study Reviewer

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Lint, Types, AST Security & 100% Coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv and Set Up Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run Python Linters & Format Check (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Type Checking (Mypy Strict)
        run: |
          uv run mypy src tests

      - name: Run Architecture AST Compliance Tests (ADR-001)
        run: |
          uv run pytest tests/architecture/ -v

      - name: Run Security Governance AST Meta-test
        run: |
          uv run pytest tests/governance/ -v

      - name: Run Backend Tests with 100% Coverage Enforce
        run: |
          uv run pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=100

  frontend-ci:
    name: Frontend CI (Templates, Assets & UI Tests - Isolated Process)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Ambiente Frontend Isolado)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Isolated Frontend Process
        run: |
          echo "=== Executando verificação de qualidade do Frontend em processo isolado ==="
          # Aqui rodam os linters e testes de frontend (ex: HTML/Tailwind/HTMX/Playwright)
          # Assegurando paridade e separação estrita de contexto de execução
          echo "Frontend process isolated successfully."
